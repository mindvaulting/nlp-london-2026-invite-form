<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submissions — NLP Canada 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 32px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: #3b4fdb;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s;
    }

    .download-btn:hover { background: #2d3fc7; }
    .download-btn:active { background: #2232a8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>NLP Canada 2026</h1>
    <p>Download all form submissions as a CSV file.</p>
    <a class="download-btn" href="/api/export" download="submissions.csv">
      ⬇ Download Submissions (CSV)
    </a>
  </div>
</body>
</html>
