<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — NLP Canada 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 36px 40px 40px;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.85rem;
      color: #888;
    }

    /* Top 3 podium */
    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 36px;
    }

    .podium-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .podium-medal {
      font-size: 2rem;
    }

    .podium-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #1e3a5f;
      text-align: center;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .podium-count {
      font-size: 0.75rem;
      color: #666;
    }

    .podium-block {
      width: 100px;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }

    .podium-block.first  { height: 80px; background: #f6c90e; }
    .podium-block.second { height: 60px; background: #a8a9ad; }
    .podium-block.third  { height: 45px; background: #cd7f32; }

    .podium-item.empty .podium-name { color: #ccc; }
    .podium-item.empty .podium-block { background: #e5e7eb; }

    /* Full table */
    .table-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin-bottom: 12px;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
    }

    .leaderboard-table th {
      text-align: left;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      padding: 0 12px 10px;
      border-bottom: 1.5px solid #f0f0f0;
    }

    .leaderboard-table th:last-child { text-align: right; }

    .leaderboard-table td {
      padding: 13px 12px;
      border-bottom: 1px solid #f5f5f5;
      font-size: 0.92rem;
      color: #222;
    }

    .leaderboard-table td:last-child { text-align: right; }

    .leaderboard-table tr:last-child td { border-bottom: none; }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 0.78rem;
      font-weight: 700;
      background: #f3f4f6;
      color: #555;
    }

    .rank-badge.top { background: #eef2ff; color: #3b4fdb; }

    .friend-bar-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .friend-bar {
      height: 6px;
      border-radius: 4px;
      background: #3b4fdb;
      min-width: 4px;
      transition: width 0.3s;
    }

    .friend-count {
      font-weight: 700;
      color: #1e3a5f;
      min-width: 20px;
      text-align: right;
    }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: #aaa;
      font-size: 0.95rem;
    }

    .loading {
      text-align: center;
      padding: 48px 0;
      color: #aaa;
      font-size: 0.95rem;
    }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #3b4fdb;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-weight: 600;
    }

    .refresh-btn:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .card { padding: 24px 16px 28px; }
      .podium-block { width: 80px; }
      .podium-name { max-width: 80px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>🏆 Top Inviters</h1>
      <p>NLP Canada 2026 — July 18, 2026 &nbsp;·&nbsp; <button class="refresh-btn" onclick="load()">↻ Refresh</button></p>
    </div>

    <div id="podium" class="podium"></div>

    <div class="table-title">All Participants</div>
    <div id="tableWrap"><div class="loading">Loading…</div></div>
  </div>

  <script>
    async function load() {
      document.getElementById('tableWrap').innerHTML = '<div class="loading">Loading…</div>';
      document.getElementById('podium').innerHTML = '';

      try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();

        renderPodium(data);
        renderTable(data);
      } catch (e) {
        document.getElementById('tableWrap').innerHTML = '<div class="empty-state">Failed to load leaderboard.</div>';
      }
    }

    function renderPodium(data) {
      const medals = ['🥇', '🥈', '🥉'];
      const classes = ['first', 'second', 'third'];
      const order = [1, 0, 2]; // visual order: 2nd, 1st, 3rd
      const podium = document.getElementById('podium');

      if (data.length === 0) { podium.innerHTML = ''; return; }

      const html = order.map(idx => {
        const entry = data[idx];
        const isEmpty = !entry;
        return `
          <div class="podium-item ${isEmpty ? 'empty' : ''}">
            <div class="podium-medal">${medals[idx]}</div>
            <div class="podium-name">${isEmpty ? '—' : entry.name}</div>
            <div class="podium-count">${isEmpty ? '' : entry.friends + ' friend' + (entry.friends !== 1 ? 's' : '')}</div>
            <div class="podium-block ${classes[idx]}">${idx + 1}</div>
          </div>
        `;
      }).join('');

      podium.innerHTML = html;
    }

    function renderTable(data) {
      const wrap = document.getElementById('tableWrap');

      if (data.length === 0) {
        wrap.innerHTML = '<div class="empty-state">No submissions yet. Be the first!</div>';
        return;
      }

      const max = data[0].friends || 1;

      const rows = data.map(entry => {
        const barWidth = Math.round((entry.friends / max) * 80);
        const isTop = entry.rank <= 3;
        return `
          <tr>
            <td><span class="rank-badge ${isTop ? 'top' : ''}">${entry.rank}</span></td>
            <td>${entry.name}</td>
            <td>
              <div class="friend-bar-wrap">
                <div class="friend-bar" style="width:${barWidth}px"></div>
                <span class="friend-count">${entry.friends}</span>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      wrap.innerHTML = `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Friends Invited</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    load();
  </script>
</body>
</html>
